<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anu AI – PLY Viewer V3</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#171020;color:white;font-family:Arial,sans-serif}
#viewer{width:100%;height:88vh;min-height:400px}
#status{padding:12px;text-align:center;font-size:14px}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/",
    "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
  }
}
</script>
</head>
<body>
<div id="viewer"></div>
<div id="status">அனு 3D மாடல் ஏற்றப்படுகிறது…</div>
<script type="module">
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

const status = document.getElementById('status');
const viewer = new GaussianSplats3D.Viewer({
  cameraUp: [0, 1, 0],
  initialCameraPosition: [0, 0, 2.5],
  initialCameraLookAt: [0, 0, 0],
  useBuiltInControls: true,
  selfDrivenMode: true,
  sphericalHarmonicsDegree: 0,
  kernel2DSize: 0.22,
  focalAdjustment: 1.0,
  logLevel: GaussianSplats3D.LogLevel.Error
});

viewer.addSplatScene('./ok%203d%20col%20anu.ply', {
  showLoadingUI: true,
  progressiveLoad: false,
  splatAlphaRemovalThreshold: 1,
  scale: [1, 1, 1],
  rotation: [0, 0, 1, 0]
}).then(() => {
  viewer.start();
  status.textContent = 'அனு 3D மாடல் ஏற்றப்பட்டது. விரலால் இழுத்து சுழற்றலாம்.';
}).catch((error) => {
  console.error(error);
  status.textContent = 'மாடல் ஏற்ற முடியவில்லை: ' + (error?.message || error);
});
</script>
</body>
</html>
