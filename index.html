<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anu AI - Clear 3D Viewer V5</title>

<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #100d18;
  color: white;
  font-family: Arial, sans-serif;
}
#viewer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
#viewer canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#status {
  position: fixed;
  z-index: 10;
  left: 0;
  right: 0;
  bottom: 12px;
  padding: 12px;
  text-align: center;
  color: white;
  font-size: 14px;
  background: rgba(0,0,0,.55);
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
  }
}
</script>
</head>

<body>
<div id="viewer"></div>
<div id="status">அனு 3D மாடல் ஏற்றப்படுகிறது...</div>

<script type="module">
import * as GaussianSplats3D from
  '@mkkellogg/gaussian-splats-3d';

const status = document.getElementById('status');
const host = document.getElementById('viewer');

async function startAnu() {
  try {
    status.textContent = '3D நூலகம் ஏற்றப்படுகிறது...';

    const viewer = new GaussianSplats3D.Viewer({
      cameraUp: [0, 1, 0],
      initialCameraPosition: [0, 0, 3],
      initialCameraLookAt: [0, 0, 0],
      useBuiltInControls: true,
      selfDrivenMode: true,
      sphericalHarmonicsDegree: 0,
      sharedMemoryForWorkers: false,
      gpuAcceleratedSort: false,
      ignoreDevicePixelRatio: false,
      halfPrecisionCovariancesOnGPU: false,
      antialiased: true,
      focalAdjustment: 1.0,
      logLevel: GaussianSplats3D.LogLevel.Error
    });

    status.textContent = 'அனு 3D மாடல் பதிவிறக்கம் செய்யப்படுகிறது...';

    const modelPath = new URL(
      './ok%203d%20col%20anu.ply',
      document.baseURI
    ).href;

    await viewer.addSplatScene(modelPath, {
      format: GaussianSplats3D.SceneFormat.Ply,
      showLoadingUI: true,
      progressiveLoad: true,
      splatAlphaRemovalThreshold: 1,
      scale: [1, 1, 1],
      rotation: [0, 0, 1, 0]
    });

    viewer.start();

    status.textContent =
      'அனு 3D மாடல் ஏற்றப்பட்டது! விரலால் இழுத்து சுழற்றலாம்.';

  } catch (error) {
    console.error('Anu Viewer Error:', error);
    status.textContent =
      'பிழை: ' + (error.message || String(error));
  }
}

startAnu();
</script>
</body>
</html>
