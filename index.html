<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anu AI Clear 3D</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#100d14;color:white;
 font-family:Arial,sans-serif;text-align:center
}
header{padding:12px}
h2{margin:5px}
#stage{
 width:100%;height:75vh;min-height:420px;
 position:relative;overflow:hidden;
 background:radial-gradient(ellipse,#51445c,#17121e);
}
#viewer{position:absolute;inset:0}
.controls{padding:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button,select{
 padding:11px;border-radius:9px;border:1px solid #a48ab8;
 background:#392a45;color:white;font-size:14px
}
select{min-width:200px}
#status{padding:10px;font-size:13px}
</style>
</head>
<body>
<header>
<h2>💜 Anu AI – Clear 3D</h2>
<div>Original Colour · Face Clarity Adjustment</div>
</header>

<div id="stage">
<div id="viewer"></div>
</div>

<div class="controls">
<select id="model">
<option value="ok 3d col anu.ply">Primary – Anu</option>
<option value="3D col 1.ply">Colour 1</option>
<option value="3d col 2.ply">Colour 2</option>
</select>
<button id="reset">Reset View</button>
<button id="fullscreen">Full Screen</button>
</div>

<div id="status">Loading 3D model...</div>

<script type="module">
import * as GaussianSplats3D from
'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js';

const host=document.getElementById('viewer');
const status=document.getElementById('status');
const select=document.getElementById('model');

let viewer=null;
let loading=false;

async function loadModel(filename){
 if(loading)return;
 loading=true;
 status.textContent='Loading '+filename+'...';

 try{
  if(viewer){
   viewer.dispose();
   viewer=null;
  }

  host.replaceChildren();

  viewer=new GaussianSplats3D.Viewer({
   rootElement:host,
   selfDrivenMode:true,
   useBuiltInControls:true,
   cameraUp:[0,1,0],
   initialCameraPosition:[0,0,1.55],
   initialCameraLookAt:[0,0,0],
   sharedMemoryForWorkers:false,
   gpuAcceleratedSort:false,
   ignoreDevicePixelRatio:false,
   halfPrecisionCovariancesOnGPU:false,
   sphericalHarmonicsDegree:0,

   // Clarity adjustment
   focalAdjustment:1.30,
   kernel2DSize:0.12,
   maxScreenSpaceSplatSize:1024,

   sceneRevealMode:GaussianSplats3D.SceneRevealMode.Instant,
   logLevel:GaussianSplats3D.LogLevel.Error
  });

  await viewer.addSplatScene(
   './'+encodeURIComponent(filename),
   {
    format:GaussianSplats3D.SceneFormat.Ply,
    showLoadingUI:true,
    splatAlphaRemovalThreshold:1,
    progressiveLoad:false,
    scale:[1,1,1],

    // Preserve upright orientation
    rotation:[0,0,1,0]
   }
  );

  viewer.start();
  status.textContent='3D Model Loaded Successfully';

 }catch(error){
  console.error(error);
  status.textContent='Error: '+error.message;
 }finally{
  loading=false;
 }
}

select.addEventListener('change',()=>{
 loadModel(select.value);
});

document.getElementById('reset').addEventListener('click',()=>{
 loadModel(select.value);
});

document.getElementById('fullscreen').addEventListener('click',()=>{
 const stage=document.getElementById('stage');
 if(!document.fullscreenElement){
  stage.requestFullscreen?.();
 }else{
  document.exitFullscreen?.();
 }
});

loadModel(select.value);
</script>
</body>
</html>
