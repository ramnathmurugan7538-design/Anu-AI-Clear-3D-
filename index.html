
<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anu AI 3D Viewer</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171020;color:white;font-family:Arial,sans-serif}
#viewer{width:100%;height:88vh}
#status{padding:12px;text-align:center;font-size:14px}
</style>
</head>
<body>
<div id="viewer"></div>
<div id="status">Anu 3D Model ஏற்றப்படுகிறது...</div>
<script type="module">
import * as GaussianSplats3D from
'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js';

const status=document.getElementById('status');
const viewer=new GaussianSplats3D.Viewer({
 rootElement:document.getElementById('viewer'),
 selfDrivenMode:true,
 useBuiltInControls:true,
 cameraUp:[0,1,0],
 initialCameraPosition:[0,0,1.5],
 initialCameraLookAt:[0,0,0],
 sphericalHarmonicsDegree:0,
 kernel2DSize:0.22,
 focalAdjustment:1.15
});

try{
 await viewer.addSplatScene('./ok%203d%20col%20anu.ply',{
  format:GaussianSplats3D.SceneFormat.Ply,
  showLoadingUI:true,
  progressiveLoad:false,
  scale:[1,1,1],
  rotation:[0,0,1,0]
 });
 viewer.start();
 status.textContent='Anu 3D Model Loaded';
}catch(error){
 status.textContent='Model Error: '+error.message;
 console.error(error);
}
</script>
</body>
</html>
